<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icon of a constellation forming a route">
  <title>GitHub journey icon</title>
  <g stroke="#0EA5E9" stroke-width="1" opacity="0.6">
    <line x1="10" y1="34" x2="20" y2="20"/>
    <line x1="20" y1="20" x2="30" y2="26"/>
    <line x1="30" y1="26" x2="40" y2="12"/>
  </g>
  <g fill="#0EA5E9">
    <circle cx="10" cy="34" r="2"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="20" r="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="26" r="2"><animate attributeName="opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="12" r="2.5" fill="#FACC15"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>