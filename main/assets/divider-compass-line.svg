<svg width="100%" height="36" viewBox="0 0 1200 36" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decorative divider styled as a compass bearing line">
  <line x1="0" y1="18" x2="560" y2="18" stroke="#334155" stroke-width="1"/>
  <line x1="640" y1="18" x2="1200" y2="18" stroke="#334155" stroke-width="1"/>
  <g transform="translate(600,18)">
    <circle r="14" fill="none" stroke="#0EA5E9" stroke-width="1.25" opacity="0.8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#0EA5E9" stroke-width="1.25"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#0EA5E9" stroke-width="1.25"/>
      <circle cx="0" cy="-10" r="1.75" fill="#FACC15"/>
    </g>
  </g>
</svg>