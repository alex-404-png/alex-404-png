<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minimal geometric line-art illustration of a navigational compass">
  <circle cx="75" cy="75" r="70" fill="none" stroke="#334155" stroke-width="1"/>
  <circle cx="75" cy="75" r="58" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.6"/>
  <g stroke="#334155" stroke-width="1">
    <line x1="75" y1="10" x2="75" y2="22"/>
    <line x1="75" y1="128" x2="75" y2="140"/>
    <line x1="10" y1="75" x2="22" y2="75"/>
    <line x1="128" y1="75" x2="140" y2="75"/>
  </g>
  <text x="75" y="30" text-anchor="middle" font-size="10" fill="#CBD5E1" font-family="Georgia, serif">N</text>
  <text x="75" y="126" text-anchor="middle" font-size="10" fill="#CBD5E1" font-family="Georgia, serif">S</text>
  <text x="18" y="79" text-anchor="middle" font-size="10" fill="#CBD5E1" font-family="Georgia, serif">W</text>
  <text x="132" y="79" text-anchor="middle" font-size="10" fill="#CBD5E1" font-family="Georgia, serif">E</text>
  <g transform="translate(75,75)">
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="40s" repeatCount="indefinite" additive="sum"/>
    <polygon points="0,-42 6,0 0,10 -6,0" fill="#0EA5E9" opacity="0.9"/>
    <polygon points="0,42 6,0 0,-10 -6,0" fill="#FACC15" opacity="0.85"/>
  </g>
  <circle cx="75" cy="75" r="4" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1"/>
</svg>